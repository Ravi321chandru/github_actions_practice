name: CI_Practice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:  
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  
  notify-success:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Confirm dependency worked
        run: echo "build-and-test finished successfully, so this job was allowed to run"