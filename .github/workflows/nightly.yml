name: Nightly_Check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min, just for testing
  workflow_dispatch:         # adds a manual "Run workflow" button

jobs:
  nightly-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Show run time
        run: echo "Triggered by ${{ github.event_name }} at $(date -u)"

